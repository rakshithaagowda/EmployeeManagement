{% extends 'base.html' %}

{% block title %}Edit Employee{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-9">

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h2>
                    <i class="bi bi-pencil-square"></i>
                    Edit Employee
                </h2>

            </div>

            <div class="card-body">

                <form method="POST" enctype="multipart/form-data">

                    <!-- Employee Photo -->

                    <div class="text-center mb-4">

                        {% if employee.photo %}

                        <img
                            src="{{ url_for('static', filename='uploads/' + employee.photo) }}"
                            class="rounded-circle border shadow"
                            width="150"
                            height="150"
                            style="object-fit: cover;">

                        {% else %}

                        <img
                            src="https://via.placeholder.com/150?text=👤"
                            class="rounded-circle border shadow"
                            width="150"
                            height="150">

                        {% endif %}

                        <h5 class="mt-3">

                            Current Employee Photo

                        </h5>

                    </div>

                    <!-- Upload New Photo -->

                    <div class="mb-4">

                        <label class="form-label">

                            Upload New Photo

                        </label>

                        <input
                            type="file"
                            class="form-control"
                            name="photo"
                            accept=".jpg,.jpeg,.png,.gif">

                        <div class="form-text">

                            Leave empty to keep the current photo.

                        </div>

                    </div>

                    <!-- Delete Photo -->

                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="delete_photo"
                            id="delete_photo">

                        <label
                            class="form-check-label"
                            for="delete_photo">

                            Remove Current Photo

                        </label>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Employee ID</label>

                            <input
                                type="text"
                                class="form-control"
                                name="employee_id"
                                value="{{ employee.employee_id }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Full Name</label>

                            <input
                                type="text"
                                class="form-control"
                                name="full_name"
                                value="{{ employee.full_name }}"
                                required>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label>Email</label>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            value="{{ employee.email }}"
                            required>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Department</label>

                            <select
                                class="form-select"
                                name="department">

                                {% for dept in [
                                    "Information Technology",
                                    "Human Resources",
                                    "Finance",
                                    "Marketing",
                                    "Sales",
                                    "Operations"
                                ] %}

                                <option
                                    value="{{ dept }}"
                                    {% if employee.department == dept %}selected{% endif %}>

                                    {{ dept }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Designation</label>

                            <input
                                type="text"
                                class="form-control"
                                name="designation"
                                value="{{ employee.designation }}"
                                required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Salary</label>

                            <input
                                type="number"
                                class="form-control"
                                name="salary"
                                value="{{ employee.salary }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Phone</label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                value="{{ employee.phone }}"
                                required>

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-warning">

                        <i class="bi bi-check-circle-fill"></i>

                        Update Employee

                    </button>

                    <a
                        href="/"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
