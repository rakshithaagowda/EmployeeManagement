{% extends 'base.html' %}

{% block title %}Add Employee{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3>
                    <i class="bi bi-person-plus-fill"></i>
                    Add Employee
                </h3>

            </div>

            <div class="card-body">

                <form method="POST" enctype="multipart/form-data">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Employee ID</label>

                            <input
                                type="text"
                                class="form-control"
                                name="employee_id"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Full Name</label>

                            <input
                                type="text"
                                class="form-control"
                                name="full_name"
                                required>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Email</label>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            required>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Department</label>

                            <select
                                class="form-select"
                                name="department"
                                required>

                                <option>Information Technology</option>
                                <option>Human Resources</option>
                                <option>Finance</option>
                                <option>Marketing</option>
                                <option>Sales</option>
                                <option>Operations</option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Designation</label>

                            <input
                                type="text"
                                class="form-control"
                                name="designation"
                                required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Salary</label>

                            <input
                                type="number"
                                class="form-control"
                                name="salary"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Phone</label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                required>

                        </div>

                    </div>

                    <!-- Employee Photo -->

                    <div class="mb-4">

                        <label class="form-label">

                            Employee Photo

                        </label>

                        <input
                            type="file"
                            class="form-control"
                            name="photo"
                            accept=".jpg,.jpeg,.png,.gif">

                        <div class="form-text">

                            Supported formats: JPG, JPEG, PNG and GIF.

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Save Employee

                    </button>

                    <a
                        href="/"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
