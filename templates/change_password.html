{% extends 'base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3>
                    <i class="bi bi-key-fill"></i>
                    Change Password
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>Current Password</label>

                        <input
                            type="password"
                            class="form-control"
                            name="current_password"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>New Password</label>

                        <input
                            type="password"
                            class="form-control"
                            name="new_password"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>Confirm Password</label>

                        <input
                            type="password"
                            class="form-control"
                            name="confirm_password"
                            required>

                    </div>

                    <button class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Update Password

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
